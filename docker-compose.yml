services:
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    env_file: .env
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 5 }
  client:
    build: { context: ., dockerfile: Dockerfile.client }
    ports: ["8080:80"]
    depends_on: { server: { condition: service_healthy } }
